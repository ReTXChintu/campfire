# This deploys apps/frontend only, as a plain static build — the backend (apps/backend) is a
# real Express server and runs on a VPS instead (it needs ffmpeg + a persistent process, which
# Netlify's serverless functions can't provide; see AGENTS.md history for why this split happened).
#
# Required at build time (set in Netlify's dashboard, not here - never commit secrets):
# VITE_API_URL - the backend's public URL (e.g. https://api.example.com), baked into the static
# build by Vite at build time.

[build]
  command = "npm run build --workspace=apps/frontend"
  publish = "apps/frontend/dist"
  # Skip triggering a new build when only docs/templates or the backend changed.
  ignore = "git diff --quiet HEAD~1 HEAD -- apps/frontend package.json package-lock.json"

[build.environment]
  NODE_VERSION = "24"

# SPA fallback: client-side routing (react-router) needs every path to serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
