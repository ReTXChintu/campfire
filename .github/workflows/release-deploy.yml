name: Release build & deploy

# Only ever runs on a published GitHub Release, or by hand from the Actions tab — never on every
# push. Builds the Android APK and Windows desktop app, ships both to the server with fixed
# filenames (so apps/frontend/.env's VITE_MOBILE_APP_DOWNLOAD_URL/VITE_DESKTOP_APP_DOWNLOAD_URL
# never need to change), then redeploys the web apps there.
on:
  release:
    types: [published]
  workflow_dispatch: {}

# Prevents two deploys from racing each other over the same server if this is ever triggered twice
# in quick succession — the second run waits for the first to finish rather than interleaving.
concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.2"
  # Baked into both mobile builds at compile time (apps/mobile/lib/config.dart). Override by
  # setting an API_URL repository variable (Settings -> Secrets and variables -> Actions ->
  # Variables) if the backend's address ever changes — no workflow edit needed.
  API_URL: ${{ vars.API_URL || 'http://187.127.179.114:50001' }}
  APK_NAME: Campfire.apk
  WINDOWS_INSTALLER_NAME: Campfire.exe

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      # Baked into the app itself (apps/mobile/lib/config.dart) so it's visible in-app (top bar /
      # login screen) — read from pubspec.yaml, the single source of truth `npm run release` keeps
      # in sync across all three apps.
      - name: Determine app version
        run: |
          version=$(grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' apps/mobile/pubspec.yaml || echo "0.0.0")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release --dart-define=API_URL=${{ env.API_URL }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Stage artifact under its fixed deploy name
        run: cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk ${{ env.APK_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_NAME }}
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      # Read from pubspec.yaml (the single source of truth, kept in sync by `npm run release` —
      # see scripts/sync-mobile-version.mjs). Used both for the installer's Setup/uninstall entry
      # below and baked into the app itself (apps/mobile/lib/config.dart) so it's visible in-app.
      - name: Determine app version
        shell: pwsh
        run: |
          $pubspec = Get-Content apps/mobile/pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $Matches[1]
          } else {
            $version = "0.0.0"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows release
        working-directory: apps/mobile
        run: flutter build windows --release --dart-define=API_URL=${{ env.API_URL }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (apps/mobile/windows/installer/campfire.iss)
        shell: pwsh
        working-directory: apps/mobile/windows/installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" campfire.iss "/DMyAppVersion=$env:APP_VERSION"

      - name: Stage artifact under its fixed deploy name
        shell: pwsh
        run: Copy-Item "apps/mobile/windows/installer/Output/CampfireSetup.exe" "${{ env.WINDOWS_INSTALLER_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.WINDOWS_INSTALLER_NAME }}
          retention-days: 14

  deploy:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      # No `path:` given — actions/download-artifact reconstructs each single-file artifact
      # directly at the workspace root under its original name, so the scp step below needs no
      # directory-stripping trickery to avoid nesting a "dist/" prefix on the server.
      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer

      # Always the same two destination filenames — overwrites whatever was there before, so
      # apps/frontend/.env's download URLs never need updating.
      - name: Upload builds to the server's frontend/public folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "${{ env.APK_NAME }},${{ env.WINDOWS_INSTALLER_NAME }}"
          target: "/opt/var/campfire/apps/frontend/public"

      - name: Pull latest code, rebuild the web apps, restart pm2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use node
            cd /opt/var/campfire
            # One-time cleanup: these builds used to ship under different filenames
            # (app-release.apk / CampfireSetup.exe) — remove the stale copies so an old download
            # link never keeps serving an outdated build.
            rm -f apps/frontend/public/app-release.apk apps/frontend/public/CampfireSetup.exe
            git pull
            npm install
            npm run build
            npm run deploy:restart
