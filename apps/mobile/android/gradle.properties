org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This machine's default JDK (java-21-openjdk) is JRE-only (no javac) — Gradle's toolchain
# resolution fails with "does not provide the required capabilities: [JAVA_COMPILER]" without
# this. java-17-openjdk-jdk is a full JDK and is what the Android Gradle Plugin expects anyway.
# If you're hitting this on a different machine, either install a full JDK 17 (or newer) or
# update this path to wherever yours lives (`update-alternatives --list javac` to check installed
# JDKs, or remove this line entirely once java-21-openjdk-jdk — not just -jre — is installed).
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
