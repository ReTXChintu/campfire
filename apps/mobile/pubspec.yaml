name: campfire_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3

  # MKV playback (Windows desktop + Android): libmpv-backed, unlike video_player this decodes the
  # real container directly (true seeking, native embedded audio/subtitle track selection) instead
  # of relying on the backend's live ffmpeg-remux fallback used for every other unsupported format.
  # See lib/widgets/mkv_video_player.dart and seekMode: "raw" in apps/backend's catalog route.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Admin panel only (Windows — see platform_info.dart's isDesktopAdminCapable): picking a local
  # .srt/.vtt file to upload, mirroring the web admin's <input type="file">.
  file_picker: ^8.1.6

  # Watch Party (Android + Windows): voice/video calling + sync/chat data channel, joining the same
  # LiveKit room apps/frontend/src/routes/WatchPage.tsx does. See lib/widgets/watch_party_overlay.dart.
  livekit_client: ^2.8.1
  # Runtime camera/mic permission prompts on Android — flutter_webrtc (a livekit_client dependency)
  # doesn't request these itself, only declares that the app may need to.
  permission_handler: ^11.3.1

  # Opens the update-banner's download link in the system browser — see
  # lib/widgets/update_banner.dart.
  url_launcher: ^6.3.1

  # Windows-only fullscreen toggle for MediaKitVideoPlayer — Windows has no window-level fullscreen
  # concept otherwise. No-ops harmlessly on other platforms.
  window_manager: ^0.4.3
  # Android: MediaSession (Bluetooth/earphone/smartwatch play-pause-skip + lock-screen "now
  # playing") — see lib/services/media_session_service.dart.
  audio_service: ^0.18.15
  # Android: screen-brightness swipe gesture (left half of the player) — see
  # widgets/media_kit_video_player.dart.
  screen_brightness: ^2.1.0
  # Android: system media-volume swipe gesture (right half of the player).
  volume_controller: ^3.3.3
  # Android TV detection (systemFeatures' android.software.leanback) — see platform_info.dart's
  # isAndroidTv. Already resolved transitively (another dependency pulls it in); declared directly
  # since app code now imports it too.
  device_info_plus: ^12.4.0
  # TV pairing-code login: renders the claim-URL QR code on screen. See
  # screens/tv_pairing_login_screen.dart.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App/launcher icon generation — run `dart run flutter_launcher_icons` after changing
# assets/images/logo.png to regenerate Android mipmaps and the Windows .ico.
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0A0B0F"
  adaptive_icon_foreground: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/full_logo.png
    # Noto Sans (SIL OFL 1.1, freely bundleable) — used only as media_kit's libassAndroidFont, so
    # mpv's own subtitle renderer has a font to draw with on Android (see
    # media_kit_video_player.dart's Player configuration). Not registered as an app font family;
    # nothing in the UI itself uses it.
    - assets/fonts/NotoSans-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
